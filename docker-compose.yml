services:
  mockhub:
    build: .
    ports:
      - "8080:8080"       # web
      - "2525:2525"       # smtp
      - "1143:1143"       # imap
      - "8081:8081"       # sms api
      - "5353:5353/udp"   # dns
    environment:
      # SQLite (file trong volume). Đổi backend: xem hướng dẫn ở crates/mockhub-storage/src/lib.rs
      MOCKHUB__DATABASE__URL: sqlite:///data/mockhub.db
      RUST_LOG: info
    volumes:
      - mockhub-data:/data

volumes:
  mockhub-data:
