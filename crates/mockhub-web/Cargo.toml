[package]
name = "mockhub-web"
version.workspace = true
edition.workspace = true
license.workspace = true

# SSR + hydrate (Dioxus fullstack): một crate, hai feature, `dx` tự chọn theo platform:
#   web    -> client wasm (hydrate sau khi server render sẵn HTML)
#   server -> SSR + server functions (`#[get]`/`#[post]`), chạy trong mockhub-server
[dependencies]
dioxus.workspace = true
serde.workspace = true

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]
