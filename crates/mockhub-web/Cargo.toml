[package]
name = "mockhub-web"
version.workspace = true
edition.workspace = true
license.workspace = true

# SSR + hydrate (Dioxus fullstack): một crate, hai feature, `dx` tự chọn theo platform:
#   web    -> client wasm (hydrate sau khi server render sẵn HTML)
#   server -> SSR + server functions (`#[get]`/`#[post]`), chạy trong mockhub-server
[dependencies]
dioxus.workspace = true
serde.workspace = true
# Chỉ phía server (không vào wasm): truy cập dữ liệu qua trait `Storage`, không biết backend.
mockhub-core = { workspace = true, optional = true }
mockhub-storage = { workspace = true, optional = true }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "dep:mockhub-core", "dep:mockhub-storage"]
